
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockCET Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">
            <img src="mockCET-logo.jpg" alt="Logo" class="navbar-logo">
            <span>MockCET Practice Tests</span>
        </div>
        <div class="navbar-links">
            <a href="main.html">Home</a>
            <button id="logout-btn" style="display:none;">Logout</button>
        </div>
    </div>

    <div id="quiz-container" class="quiz-container">
        <h2 id="test-title">Loading Test...</h2>

        <div class="quiz-header">
            <div id="timer">Time Left: --:--</div>
            <div class="progress-bar-container">
                <div id="progress-bar-inner"></div>
            </div>
        </div>

        <div id="question-tracker" class="q-tracker-container"></div>

        <div id="question-container">
            <!-- Questions will be loaded here by JavaScript -->
        </div>

        <div class="navigation-buttons">
            <button id="prevBtn" disabled>Previous</button>
            <button id="nextBtn" disabled>Next</button>
            <button id="submitBtn" style="display: none;">Submit Quiz</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-database-compat.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
