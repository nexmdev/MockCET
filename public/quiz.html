<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Quiz App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="quiz-container">
  <img src="mockCET-logo.jpg" alt="Logo" class="logo">
  <h2 id="test-title"></h2>
  <div class="progress-bar"><div id="progress" class="progress"></div></div>
  <div id="questionTracker" class="tracker"></div>
  <div class="timer" id="timer">Remaining Time: 60s</div>
  <div id="quiz"></div>
  <div id="navigation">
    <button id="prevBtn">Previous</button>
    <button id="nextBtn">Next</button>
  </div>

  <button id="submitBtn" style="display: none;">Submit Quiz</button>

  <div id="result" class="result-text"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-database-compat.js"></script>

<script src="/__/firebase/init.js"></script>
<!-- Custom JS -->
<script src="quiz.js"></script>
</body>
</html>
