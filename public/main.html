<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockCET Practice Tests</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">
            <img src="mockCET-logo.jpg" alt="Logo" class="navbar-logo">
            <span>MockCET Practice Tests</span>
        </div>
        <div class="navbar-links">
            <a href="main.html">Home</a>
            <button id="logout-btn" style="display:none;">Logout</button>
        </div>
    </div>
    <div class="quiz-container">
        <h1>MockCET Practice Tests</h1>
        <div id="admin-link-container" class="admin-link"></div>

        <div class="tab-container">
            <div class="tab-header">
                <button class="tab-link active" onclick="openTab(event, 'Physics')">Physics</button>
                <button class="tab-link" onclick="openTab(event, 'Chemistry')">Chemistry</button>
                <button class="tab-link" onclick="openTab(event, 'Maths')">Maths</button>
            </div>

            <div id="Physics" class="tab-content" style="display: block;"></div>
            <div id="Chemistry" class="tab-content"></div>
            <div id="Maths" class="tab-content"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-database-compat.js"></script>
    <script src="/__/firebase/init.js"></script>

    <!-- Custom JS -->
     <script src="app.js"></script>
    <script src="main.js"></script>
</body>
</html>
